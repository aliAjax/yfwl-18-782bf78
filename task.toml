schema_version = "1.3"

[task]
name = "local/settlement-yield-inverse"
description = "Recover an undisclosed resource-yield matrix from historical settlement totals and solve a deterministic bounded integer production plan."
authors = [{ name = "tal-batch-e" }]
keywords = ["optimization", "inverse-problem", "integer-programming", "resource-planning", "ledger"]

[agent]
timeout_sec = 3600

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true

[verifier]
timeout_sec = 120

[metadata]
difficulty = "expert"
category = "optimization"
tags = ["linear-algebra", "branch-and-bound", "integer-optimization", "resource-inversion"]
expert_time_estimate = "80m"
